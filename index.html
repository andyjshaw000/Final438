<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Celestial Ninja</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0d0b10;
      }
      canvas {
        cursor: crosshair;
      }
      .hud-btn {
        padding: 5px 14px;
        border: 1px solid rgba(255, 255, 255, .25);
        border-radius: 999px;
        background: rgba(0, 0, 0, .45);
        color: #fff;
        font: 600 12px Helvetica, Arial, sans-serif;
        cursor: pointer;
      }
      .hud-btn:hover { background: rgba(0, 0, 0, .65); }
      .hud-btn:disabled { opacity: .4; cursor: default; }
      .cards-modal.death h2 { color: #ff6a6a; text-shadow: 0 0 20px rgba(255, 60, 60, .45); }
      .death-card {
        width: min(440px, 90vw);
        padding: 26px 28px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 18px;
        background: #121016;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
        animation: cardIn .32s cubic-bezier(.2, .9, .3, 1.2) both;
      }
      .death-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
      .death-stats span { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
      .death-stats b { font-size: 22px; }
      .death-best { margin: 14px 0 0; text-align: center; color: #FFD654; font-size: 14px; }
      .death-card h3 { margin: 20px 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
      #lb-list { margin: 0; padding: 0; list-style: none; counter-reset: rank; }
      #lb-list li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255, 255, 255, .07); font-size: 14px; }
      #lb-list li:not(.lb-empty)::before { counter-increment: rank; content: counter(rank); width: 18px; opacity: .5; }
      #lb-list li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb-empty { opacity: .6; }
      .death-submit { display: flex; gap: 8px; margin-top: 18px; }
      .death-submit input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 10px; background: #1c1922; color: #fff; font: inherit; }
      .death-submit button, .death-again { padding: 10px 16px; border: 0; border-radius: 10px; font: 700 14px Helvetica, Arial, sans-serif; cursor: pointer; }
      .death-submit button { background: rgba(255, 255, 255, .12); color: #fff; }
      .death-again { width: 100%; margin-top: 12px; padding: 13px; background: #FFD654; color: #1b1a17; font-size: 16px; }
      .death-again:focus-visible, .death-submit button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .cards-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        background: radial-gradient(rgba(30, 18, 5, .55), rgba(0, 0, 0, .82));
        backdrop-filter: blur(3px);
        font-family: Helvetica, Arial, sans-serif;
        color: #fff;
        animation: fadeIn .18s ease-out;
      }
      .cards-modal h2 {
        margin: 0;
        font-size: clamp(22px, 2.6vw, 40px);
        letter-spacing: .04em;
        color: #FFD654;
        text-shadow: 0 0 20px rgba(255, 180, 0, .45);
      }
      .cards {
        display: flex;
        gap: clamp(14px, 2vw, 32px);
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 3vw;
      }
      .card {
        --accent: #FFD654;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4vh;
        width: clamp(200px, 22vw, 290px);
        min-height: clamp(280px, 46vh, 400px);
        padding: 4.5vh 22px 3vh;
        border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: 18px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 18%, #17141c) 0%, #121016 70%);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
        color: #f3efe6;
        font: inherit;
        text-align: center;
        cursor: pointer;
        animation: cardIn .32s cubic-bezier(.2, .9, .3, 1.2) both;
        transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      }
      .card:hover, .card:focus-visible {
        transform: translateY(-8px);
        border-color: var(--accent);
        box-shadow: 0 20px 50px rgba(0, 0, 0, .6), 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent);
        outline: none;
      }
      .card-icon {
        display: grid;
        place-items: center;
        width: clamp(72px, 8vw, 110px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%);
      }
      .card-icon img {
        width: 70%;
        height: 70%;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent));
      }
      .card h3 {
        margin: .4vh 0 0;
        font-size: clamp(17px, 1.6vw, 24px);
        color: var(--accent);
      }
      .card p {
        margin: 0;
        flex: 1;
        font-size: clamp(13px, 1.05vw, 16px);
        line-height: 1.45;
        opacity: .88;
      }
      .card-cta {
        margin-top: 1vh;
        padding: 8px 26px;
        border-radius: 999px;
        background: var(--accent);
        color: #1b1a17;
        font-weight: 700;
        font-size: clamp(13px, 1vw, 15px);
      }
      .card-key, .card-tag {
        position: absolute;
        top: 12px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .card-key {
        left: 12px;
        background: rgba(255, 255, 255, .1);
        color: rgba(255, 255, 255, .7);
      }
      .card-tag {
        right: 12px;
        background: color-mix(in srgb, var(--accent) 25%, transparent);
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: .06em;
      }
      .cards-hint {
        margin: 0;
        font-size: 13px;
        opacity: .6;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(24px) scale(.96); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .cards-modal { animation: none; }
        .card { transition: none; }
      }
      /* #scoreboard {
        display: none;
      } */
    </style>
  </head>
  <body>
    <!-- Libraries are pinned and bundled locally so outside updates can't break the game. -->
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.sound.min.js"></script>

    <script src="lib/planck.min.js"></script>
    <script src="lib/p5play.js"></script>

    <script src="index.js" type="module"></script>
