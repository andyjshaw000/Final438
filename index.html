<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Celestial Ninja</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0d0b10;
      }
      .cards-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2vh;
        background: radial-gradient(rgba(30, 18, 5, .55), rgba(0, 0, 0, .82));
        backdrop-filter: blur(3px);
        font-family: Helvetica, Arial, sans-serif;
        color: #fff;
        animation: fadeIn .18s ease-out;
      }
      .cards-modal h2 {
        margin: 0;
        font-size: clamp(22px, 2.6vw, 40px);
        letter-spacing: .04em;
        color: #FFD654;
        text-shadow: 0 0 20px rgba(255, 180, 0, .45);
      }
      .cards {
        display: flex;
        gap: clamp(14px, 2vw, 32px);
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 3vw;
      }
      .card {
        --accent: #FFD654;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4vh;
        width: clamp(200px, 22vw, 290px);
        min-height: clamp(280px, 46vh, 400px);
        padding: 4.5vh 22px 3vh;
        border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: 18px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 18%, #17141c) 0%, #121016 70%);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
        color: #f3efe6;
        font: inherit;
        text-align: center;
        cursor: pointer;
        animation: cardIn .32s cubic-bezier(.2, .9, .3, 1.2) both;
        transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      }
      .card:hover, .card:focus-visible {
        transform: translateY(-8px);
        border-color: var(--accent);
        box-shadow: 0 20px 50px rgba(0, 0, 0, .6), 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent);
        outline: none;
      }
      .card-icon {
        display: grid;
        place-items: center;
        width: clamp(72px, 8vw, 110px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%);
      }
      .card-icon img {
        width: 70%;
        height: 70%;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent));
      }
      .card h3 {
        margin: .4vh 0 0;
        font-size: clamp(17px, 1.6vw, 24px);
        color: var(--accent);
      }
      .card p {
        margin: 0;
        flex: 1;
        font-size: clamp(13px, 1.05vw, 16px);
        line-height: 1.45;
        opacity: .88;
      }
      .card-cta {
        margin-top: 1vh;
        padding: 8px 26px;
        border-radius: 999px;
        background: var(--accent);
        color: #1b1a17;
        font-weight: 700;
        font-size: clamp(13px, 1vw, 15px);
      }
      .card-key, .card-tag {
        position: absolute;
        top: 12px;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .card-key {
        left: 12px;
        background: rgba(255, 255, 255, .1);
        color: rgba(255, 255, 255, .7);
      }
      .card-tag {
        right: 12px;
        background: color-mix(in srgb, var(--accent) 25%, transparent);
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: .06em;
      }
      .cards-hint {
        margin: 0;
        font-size: 13px;
        opacity: .6;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(24px) scale(.96); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .cards-modal { animation: none; }
        .card { transition: none; }
      }
      /* #scoreboard {
        display: none;
      } */
    </style>
  </head>
